# One entry per paragraph.
about:
  - I study how language models store and use information. My current project, Seahorse, asks whether a frozen model can remember what you told it in an earlier conversation, and what breaks when it tries.
  - I've also worked on deep reinforcement learning, diffusion and state-space models, and I write long-form tutorials on them for Towards Data Science.

# The highlighted card at the top of Research.
featured:
  id: seahorse
  kicker: Current · independent project
  title: "Seahorse: a memory for a frozen language model"
  url: seahorse/
  summary: A vector pushed into a model's activations carries leanings, but not facts. A stored two-position slice of its own attention memory carries facts, and breaks in specific ways.
  paper:
    label: Paper 1
    title: What Survives When Activation Steering Is Used as Memory
    ref: arXiv:2610.14958
  buttons:
    - label: Project page
      url: seahorse/
      primary: true
    - label: Paper
      url: https://arxiv.org/abs/2610.14958
      external: true
    - label: Code
      url: https://github.com/vedant-jumle/Seahorse
      external: true
  explainers:
    - title: Binding across positions
      url: seahorse/binding/
    - title: The subject-position test
      url: seahorse/subject-position/
    - title: Automatic slice selection
      url: seahorse/automatic-selection/

# Papers and datasets, listed under the featured card.
research:
  - id: climate-adaptation-heritage-retrieval
    title: Retrieving Climate Change Adaptation Concepts from World Heritage Management Plans in the Netherlands
    url: https://openreview.net/forum?id=qGI1qus1Di
    meta: ClimateNLP @ EMNLP 2026 · workshop paper
    desc: A retrieval benchmark built from expert-labelled passages in the management plans of 11 Dutch World Heritage sites. Compares BM25, a bi-encoder, a dense retriever with reranker, and a cross-encoder reranker, which performs best. With Orhan Agaoglu, Laurens Mol, Edgar Salas Gironés and Nan Bai.

  - id: twitter-journalism-global-south
    title: "Decoding the Star System: Twitter and Journalism in the Global South"
    url: https://onlinelibrary.wiley.com/doi/abs/10.1111/1758-5899.13252
    meta: Global Policy · journal paper
    desc: How Twitter shapes journalism and the visibility of journalists in the Global South.

